[project]
name = "normie"
version = "0.2.0"
description = "Agentic control plane for designing, building and operating PostgreSQL databases"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pydantic-ai-slim[openai]>=1.0",
  "sqlglot>=26",
  "cryptography>=43",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
